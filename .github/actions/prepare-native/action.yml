name: Prepare native verification
description: Shared hosted Ubuntu SDK, KVM and owned-process prerequisites
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
    - shell: bash
      run: npm ci --no-audit --no-fund
    - name: Prepare hosted KVM and stable SDK packages without accepting new licenses
      shell: bash
      run: |
        set -euo pipefail
        test -c /dev/kvm
        if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
        fi
        test -r /dev/kvm && test -w /dev/kvm
        test -s "$ANDROID_HOME/licenses/android-sdk-license"
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --channel=0 \
          "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" \
          "system-images;android-35;google_apis;x86_64" </dev/null
        test -s "$ANDROID_HOME/platforms/android-35/android.jar"
        test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
        test -x "$ANDROID_HOME/platform-tools/adb"
        test -x "$ANDROID_HOME/emulator/emulator"
        test -s "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/system.img"
    - name: Verify Linux process, ownership and build entry points
      shell: bash
      run: node --test scripts/tests/linux-emulator.test.mjs scripts/tests/linux-process.test.mjs scripts/tests/linux-runtime.test.mjs scripts/tests/worker-diagnostics.test.mjs scripts/tests/native-lifecycle.test.mjs scripts/tests/bounded-worker-log.test.mjs
    - name: Check the emulator loader and resolve only its approved missing runtime dependency
      shell: pwsh
      run: |
        node scripts/linux-runtime.mjs
        exit $LASTEXITCODE
