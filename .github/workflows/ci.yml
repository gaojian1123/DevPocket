name: DevPocket verification

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Base commit or ref to compare with the selected workflow ref
        type: string
        required: true
      backend_diagnostic:
        description: Run the normal backend job only with bounded diagnostics; never acceptance
        type: boolean
        default: false

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

concurrency:
  group: devpocket-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: windows-latest
    outputs:
      base: ${{ steps.plan.outputs.base }}
      tooling: ${{ steps.plan.outputs.tooling }}
      tooling_shards: ${{ steps.plan.outputs.tooling_shards }}
      macos: ${{ steps.plan.outputs.macos }}
      backend: ${{ steps.plan.outputs.backend }}
      android: ${{ steps.plan.outputs.android }}
      device: ${{ steps.plan.outputs.device }}
      apple: ${{ steps.plan.outputs.apple }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
      - id: plan
        shell: pwsh
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: |
          $base = git merge-base HEAD $env:BASE_REF
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the comparison base.' }
          node scripts\verify.mjs --base $base --plan --report .data\ci\plan.json
          if ($LASTEXITCODE -ne 0) { throw 'Verification planning failed.' }
          $plan = Get-Content -LiteralPath .data\ci\plan.json -Raw | ConvertFrom-Json
          "base=$($plan.base)" >> $env:GITHUB_OUTPUT
          foreach ($group in @('tooling', 'backend', 'android', 'device', 'apple')) {
            "$group=$($plan.requiredGroups -contains $group)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          }
          if ($plan.ciMacos -isnot [bool]) { throw 'CI requires an explicit macOS coverage decision from the planner.' }
          "macos=$($plan.ciMacos)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          if (($plan.requiredGroups -contains 'tooling') -and !$plan.toolingShards) {
            throw 'CI requires the reviewed complete test-tooling.mjs entry without replacement scripts or lifecycle hooks.'
          }
          if ($plan.ciMacos -and -not ($plan.toolingShards.parts.id -contains 'native')) {
            throw 'Selected macOS coverage requires the native tooling shard.'
          }
          $shards = @(if ($plan.toolingShards) { $plan.toolingShards.parts.id } else { 'all' })
          "tooling_shards=$(ConvertTo-Json -InputObject $shards -Compress)" >> $env:GITHUB_OUTPUT
      - name: Explain plan outcome
        id: diagnostics
        if: always() && hashFiles('scripts/verification-diagnostics.mjs') != ''
        shell: pwsh
        env:
          STEP_RESULT: ${{ steps.plan.outcome }}
        run: |
          node scripts/verification-diagnostics.mjs --directory .data/ci --job plan --step-result $env:STEP_RESULT --github
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always() && steps.diagnostics.outputs.report_ready == 'true'
        with:
          name: check-diagnostics-plan-attempt-${{ github.run_attempt }}
          path: .data/ci/verification-diagnostics.json
          if-no-files-found: error

  tooling:
    needs: plan
    if: needs.plan.outputs.tooling == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.backend_diagnostic)
    name: Tooling (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.tooling_shards) }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Verify complete tooling regression suite
        id: verify
        shell: pwsh
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
          TOOLING_PART: ${{ matrix.part }}
        run: |
          $arguments = @('scripts\verify.mjs', '--base', $env:BASE_SHA, '--group', 'tooling', '--report', '.data\ci\tooling\report.json')
          if ($env:TOOLING_PART -ne 'all') { $arguments += @('--tooling-shard', $env:TOOLING_PART) }
          node @arguments
          exit $LASTEXITCODE
      - name: Bind tooling evidence to this CI attempt
        if: always() && hashFiles('scripts/verification-ci.mjs') != ''
        shell: pwsh
        env:
          TOOLING_PART: ${{ matrix.part }}
        run: |
          node scripts\verification-ci.mjs --seal --unit "tooling-$env:TOOLING_PART" --input .data\ci\tooling\report.json --report .data\ci\tooling\ci-report.json
          exit $LASTEXITCODE
      - name: Explain tooling check outcome
        id: diagnostics
        if: always() && hashFiles('scripts/verification-diagnostics.mjs') != ''
        shell: pwsh
        env:
          STEP_RESULT: ${{ steps.verify.outcome }}
        run: |
          node scripts/verification-diagnostics.mjs --directory .data/ci/tooling --job tooling --step-result $env:STEP_RESULT --github
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always() && steps.diagnostics.outputs.report_ready == 'true'
        with:
          name: check-diagnostics-tooling-${{ matrix.part }}-attempt-${{ github.run_attempt }}
          path: .data/ci/tooling/verification-diagnostics.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-tooling-${{ matrix.part }}-attempt-${{ github.run_attempt }}
          path: |
            .data\ci\tooling\report.json
            .data\ci\tooling\ci-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('.data/ci/tooling/tooling-progress.jsonl') != ''
        with:
          name: tooling-progress-${{ matrix.part }}-attempt-${{ github.run_attempt }}
          path: .data/ci/tooling/tooling-progress.jsonl
          if-no-files-found: error

  macos:
    needs: plan
    if: needs.plan.outputs.macos == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.backend_diagnostic)
    name: macOS regressions
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      DOTNET_MultiCoreJitNoProfileGather: '1'
      npm_config_registry: https://packagefeedproxy.microsoft.io/npm/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require the intended native host
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') throw new Error('macOS regressions require an ARM64 Mac runner.');"
      - run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Verify macOS native infrastructure
        id: verify
        shell: bash
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
          XDG_CACHE_HOME: ${{ runner.temp }}/devpocket-cache
        run: |
          node scripts/verify.mjs --base "$BASE_SHA" --group tooling --tooling-shard native --report .data/ci/macos/report.json
      - name: Bind macOS evidence to this CI attempt
        if: always() && hashFiles('scripts/verification-ci.mjs') != ''
        shell: bash
        run: |
          node scripts/verification-ci.mjs --seal --unit macos --input .data/ci/macos/report.json --report .data/ci/macos/ci-report.json
      - name: Explain macOS check outcome
        id: diagnostics
        if: always() && hashFiles('scripts/verification-diagnostics.mjs') != ''
        shell: bash
        env:
          STEP_RESULT: ${{ steps.verify.outcome }}
        run: |
          node scripts/verification-diagnostics.mjs --directory .data/ci/macos --job tooling --step-result "$STEP_RESULT" --github
      - uses: actions/upload-artifact@v7
        if: always() && steps.diagnostics.outputs.report_ready == 'true'
        with:
          name: check-diagnostics-macos-attempt-${{ github.run_attempt }}
          path: .data/ci/macos/verification-diagnostics.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-macos-attempt-${{ github.run_attempt }}
          path: |
            .data/ci/macos/report.json
            .data/ci/macos/ci-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('.data/ci/macos/tooling-progress.jsonl') != ''
        with:
          name: tooling-progress-macos-attempt-${{ github.run_attempt }}
          path: .data/ci/macos/tooling-progress.jsonl
          if-no-files-found: error

  backend:
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix deployment\azure ci --no-audit --no-fund
      - run: python -m pip install -r deployment\azure\probe\requirements-test.txt
      - name: Verify backend and operational fixtures
        id: verify
        shell: pwsh
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
        run: |
          $env:DEVPOCKET_PROBE_PYTHON = (Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          node scripts\verify.mjs --base $env:BASE_SHA --group backend --backend-diagnostics --report .data\ci\backend\report.json
          exit $LASTEXITCODE
      - name: Bind backend evidence to this CI attempt
        if: always() && hashFiles('scripts/verification-ci.mjs') != ''
        shell: pwsh
        run: |
          node scripts\verification-ci.mjs --seal --unit backend --input .data\ci\backend\report.json --report .data\ci\backend\ci-report.json
          exit $LASTEXITCODE
      - name: Explain bounded clean-release fixture failures
        if: failure() && steps.verify.outcome == 'failure'
        shell: pwsh
        run: |
          @'
          const fs = require("node:fs");
          const file = ".data/ci/backend/azure-tests.log";
          let info;
          try { info = fs.lstatSync(file); }
          catch (error) { if (error.code !== "ENOENT") throw error; }
          if (!info) {
            console.log(JSON.stringify({ kind: "release-fixture-diagnostic", status: "unavailable", reason: "missing-log" }));
          } else {
            if (!info.isFile() || info.isSymbolicLink() || info.size > 8 * 1024 * 1024) throw new Error("Unsupported private diagnostic input.");
            const text = fs.readFileSync(file, "utf8");
            const pattern = /DEVPOCKET_RELEASE_FIXTURE_FAILURE (install|build|prune|resolve) (ENOTCACHED|ENOENT|EACCES|EPERM|EUSAGE|ETARGET|ERESOLVE|EINTEGRITY|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|E401|E403|E404|MISSING_SCRIPT|MODULE_NOT_FOUND|TYPESCRIPT_ERROR|UNKNOWN|CASE_ONLY|INSTALLED_PATH|WORKSPACE_PATH|OTHER_FILE_URL|OTHER_OUTPUT)\b/g;
            const found = new Map();
            for (const item of text.matchAll(pattern)) found.set(`${item[1]}:${item[2]}`, { stage: item[1], code: item[2] });
            const failures = [...found.values()];
            console.log(JSON.stringify({ kind: "release-fixture-diagnostic", status: failures.length ? "available" : "unavailable", failures }));
          }
          '@ | node
          exit $LASTEXITCODE
      - name: Explain backend check outcomes
        id: diagnostics
        if: always() && hashFiles('scripts/verification-diagnostics.mjs') != ''
        shell: pwsh
        env:
          STEP_RESULT: ${{ steps.verify.outcome }}
        run: |
          node scripts/verification-diagnostics.mjs --directory .data/ci/backend --job backend --step-result $env:STEP_RESULT --github
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always() && steps.diagnostics.outputs.report_ready == 'true'
        with:
          name: check-diagnostics-backend-attempt-${{ github.run_attempt }}
          path: .data/ci/backend/verification-diagnostics.json
          if-no-files-found: error
      - name: Export bounded backend test diagnostics
        id: backend_diagnostics
        if: always()
        shell: pwsh
        run: |
          node scripts\backend-diagnostics.mjs --directory .data\ci\backend --github
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-backend-attempt-${{ github.run_attempt }}
          path: |
            .data\ci\backend\report.json
            .data\ci\backend\ci-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && steps.backend_diagnostics.outputs.report_ready == 'true'
        with:
          name: backend-test-diagnostics-attempt-${{ github.run_attempt }}
          path: |
            .data\ci\backend\backend-diagnostics.json
          if-no-files-found: error

  android:
    needs: plan
    if: needs.plan.outputs.android == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.backend_diagnostic)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
      - run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - name: Install locked component build dependencies
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare project-local SDK using already accepted runner licenses
        shell: pwsh
        run: .\scripts\prepare-android.ps1 -ExistingSdk $env:ANDROID_HOME
      - name: Verify native build, JVM contracts and lint
        id: verify
        shell: pwsh
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
        run: |
          node scripts\verify.mjs --base $env:BASE_SHA --group android --jdk $env:JAVA_HOME --sdk .tools\android-sdk --report .data\ci\android\report.json
          exit $LASTEXITCODE
      - name: Bind Android evidence to this CI attempt
        if: always() && hashFiles('scripts/verification-ci.mjs') != ''
        shell: pwsh
        run: |
          node scripts\verification-ci.mjs --seal --unit android --input .data\ci\android\report.json --report .data\ci\android\ci-report.json
          exit $LASTEXITCODE
      - name: Explain Android check outcome
        id: diagnostics
        if: always() && hashFiles('scripts/verification-diagnostics.mjs') != ''
        shell: pwsh
        env:
          STEP_RESULT: ${{ steps.verify.outcome }}
        run: |
          node scripts/verification-diagnostics.mjs --directory .data/ci/android --job android --step-result $env:STEP_RESULT --github
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always() && steps.diagnostics.outputs.report_ready == 'true'
        with:
          name: check-diagnostics-android-attempt-${{ github.run_attempt }}
          path: .data/ci/android/verification-diagnostics.json
          if-no-files-found: error
      - name: Export bounded Android failure diagnostics
        id: android_diagnostics
        if: failure()
        shell: pwsh
        run: |
          node scripts\android-diagnostics.mjs --directory .data\ci\android --github
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-android-attempt-${{ github.run_attempt }}
          path: |
            .data\ci\android\report.json
            .data\ci\android\ci-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && steps.android_diagnostics.outputs.report_ready == 'true'
        with:
          name: android-test-diagnostics-attempt-${{ github.run_attempt }}
          path: .data/ci/android/android-diagnostics.json
          if-no-files-found: error

  device:
    needs: [plan, android]
    if: >-
      needs.plan.outputs.device == 'true' &&
      !(github.event_name == 'workflow_dispatch' && inputs.backend_diagnostic) &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-native
      - name: Run the required isolated emulator cases
        id: verify
        shell: pwsh
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
        run: |
          ./scripts/verify.ps1 -Base $env:BASE_SHA -Group device -Jdk $env:JAVA_HOME -Sdk $env:ANDROID_HOME `
            -Image system-images/android-37.0/google_apis/x86_64 -Report .data/ci/device/report.json
          exit $LASTEXITCODE
      - name: Bind device evidence to this CI attempt
        if: always() && hashFiles('scripts/verification-ci.mjs') != ''
        shell: pwsh
        run: |
          node scripts/verification-ci.mjs --seal --unit device --input .data/ci/device/report.json --report .data/ci/device/ci-report.json
          exit $LASTEXITCODE
      - name: Explain device check outcome
        id: diagnostics
        if: always() && hashFiles('scripts/verification-diagnostics.mjs') != ''
        shell: pwsh
        env:
          STEP_RESULT: ${{ steps.verify.outcome }}
        run: |
          node scripts/verification-diagnostics.mjs --directory .data/ci/device --job device --step-result $env:STEP_RESULT --github
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always() && steps.diagnostics.outputs.report_ready == 'true'
        with:
          name: check-diagnostics-device-attempt-${{ github.run_attempt }}
          path: .data/ci/device/verification-diagnostics.json
          if-no-files-found: error
      - name: Export bounded owned-worker diagnostics
        id: worker_diagnostics
        if: always()
        shell: pwsh
        run: |
          node scripts/worker-diagnostics.mjs --directory .data/ci/device --github
          exit $LASTEXITCODE
      - name: Export device phases and instrumentation failures
        id: device_diagnostics
        if: always()
        shell: pwsh
        run: |
          node scripts/device-diagnostics.mjs --directory .data/ci/device --github
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-device-attempt-${{ github.run_attempt }}
          path: |
            .data/ci/device/report.json
            .data/ci/device/ci-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && steps.worker_diagnostics.outputs.report_ready == 'true'
        with:
          name: owned-worker-diagnostics-attempt-${{ github.run_attempt }}
          path: .data/ci/device/worker-diagnostics.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && steps.device_diagnostics.outputs.report_ready == 'true'
        with:
          name: device-test-diagnostics-attempt-${{ github.run_attempt }}
          path: .data/ci/device/device-diagnostics.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: emulator-tested-debug-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            .data/ci/device/device/device-report.json
          if-no-files-found: error

  apple:
    needs: plan
    if: needs.plan.outputs.apple == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.backend_diagnostic)
    name: Apple native verification (${{ matrix.role }})
    strategy:
      fail-fast: false
      matrix:
        role: [mac, iphone, ipad, duo]
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      npm_config_registry: https://packagefeedproxy.microsoft.io/npm/
      DOTNET_MultiCoreJitNoProfileGather: '1'
      APPLE_ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Install the required iOS 27.2 runtimes
        shell: bash
        run: |
          xcodebuild -downloadPlatform iOS -buildVersion 24B8117 -architectureVariant arm64
          xcodebuild -downloadPlatform iOS -buildVersion 24B91016s -architectureVariant arm64
      - name: Verify the selected Apple platform
        id: verify
        shell: bash
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
          XDG_CACHE_HOME: ${{ runner.temp }}/devpocket-cache
        run: |
          node scripts/verify.mjs --base "$BASE_SHA" --group apple --apple-role "$APPLE_ROLE" --report .data/ci/apple/report.json
      - name: Bind Apple evidence to this CI attempt
        if: always() && hashFiles('scripts/verification-ci.mjs') != ''
        shell: bash
        run: |
          node scripts/verification-ci.mjs --seal --unit "apple-$APPLE_ROLE" --input .data/ci/apple/report.json --report .data/ci/apple/ci-report.json
      - name: Explain Apple verification outcome
        id: diagnostics
        if: always() && hashFiles('scripts/verification-diagnostics.mjs') != ''
        shell: bash
        env:
          STEP_RESULT: ${{ steps.verify.outcome }}
        run: |
          node scripts/verification-diagnostics.mjs --directory .data/ci/apple --job apple --step-result "$STEP_RESULT" --github
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-apple-${{ matrix.role }}-attempt-${{ github.run_attempt }}
          path: |
            .data/ci/apple/report.json
            .data/ci/apple/ci-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && steps.diagnostics.outputs.report_ready == 'true'
        with:
          name: check-diagnostics-apple-${{ matrix.role }}-attempt-${{ github.run_attempt }}
          path: .data/ci/apple/verification-diagnostics.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apple-native-evidence-${{ matrix.role }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .data/ci/apple/apple/apple-owner.json
            .data/ci/apple/apple/apple-report*.json
            .data/ci/apple/apple/logs/
            .data/ci/apple/apple/*/result.xcresult/
            .data/ci/apple/apple/test-*/result-files.json
            .data/ci/apple/apple/test-*/catalog/enumeration.json
            .data/ci/apple/apple/test-*/catalog/result.xcresult/
            .data/ci/apple/apple/build-*/derived/Build/Products/**/DevPocket.app/
          if-no-files-found: error

  gate:
    name: Required verification
    needs: [plan, tooling, macos, backend, android, device, apple]
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
      - uses: actions/download-artifact@v8
        with:
          pattern: verification-*
          path: .data\ci\inputs
      - name: Require every selected check for this exact source
        id: verify
        shell: pwsh
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
          PLAN_RESULT: ${{ needs.plan.result }}
          BACKEND_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_diagnostic }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          DEVICE_RESULT: ${{ needs.device.result }}
          APPLE_RESULT: ${{ needs.apple.result }}
        run: |
          if ($env:PLAN_RESULT -ne 'success') { throw 'The required check plan did not complete.' }
          if ($env:BACKEND_ONLY -eq 'true') {
            node scripts\verify.mjs --base $env:BASE_SHA --plan --report .data\ci\gate.json
            throw 'A backend diagnostic cannot satisfy Required verification. Run full verification for acceptance.'
          }
          $arguments = @('scripts\verification-ci.mjs', '--base', $env:BASE_SHA, '--collect', '--inputs', '.data\ci\inputs', '--report', '.data\ci\ci-report.json')
          foreach ($group in @('tooling', 'macos', 'backend', 'android', 'device', 'apple')) {
            $result = [Environment]::GetEnvironmentVariable("$($group.ToUpperInvariant())_RESULT")
            if (-not $result) { $result = 'unknown' }
            $arguments += @('--upstream', "${group}:$result")
          }
          node @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Required verification is incomplete. Missing or failed device evidence is a blocker, not a skipped success.' }
          $collected = Get-Content -LiteralPath .data\ci\ci-report.json -Raw | ConvertFrom-Json
          if ($collected.report.checks | Where-Object { $_.id -eq 'apple-native' -and $_.appleEvidence.nativeAcceptanceRequired -eq $true }) {
            'Hosted CI checks passed. Same-commit complete native Apple acceptance, including mobile UI interactions and Mac WK pixels, is still required before delivery.' >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Explain aggregate outcome
        id: diagnostics
        if: always() && hashFiles('scripts/verification-diagnostics.mjs') != ''
        shell: pwsh
        env:
          STEP_RESULT: ${{ steps.verify.outcome }}
        run: |
          node scripts/verification-diagnostics.mjs --directory .data/ci --job gate --step-result $env:STEP_RESULT --github
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always() && steps.diagnostics.outputs.report_ready == 'true'
        with:
          name: check-diagnostics-gate-attempt-${{ github.run_attempt }}
          path: .data/ci/verification-diagnostics.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-summary-attempt-${{ github.run_attempt }}
          path: |
            .data\ci\gate.json
            .data\ci\ci-report.json
          if-no-files-found: error
