name: DevPocket verification

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Base commit or ref to compare with the selected workflow ref
        type: string
        required: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

concurrency:
  group: devpocket-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: windows-latest
    outputs:
      base: ${{ steps.plan.outputs.base }}
      backend: ${{ steps.plan.outputs.backend }}
      android: ${{ steps.plan.outputs.android }}
      device: ${{ steps.plan.outputs.device }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: plan
        shell: pwsh
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: |
          $base = git merge-base HEAD $env:BASE_REF
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the comparison base.' }
          node scripts\verify.mjs --base $base --plan --report .data\ci\plan.json
          if ($LASTEXITCODE -ne 0) { throw 'Verification planning failed.' }
          $plan = Get-Content -LiteralPath .data\ci\plan.json -Raw | ConvertFrom-Json
          "base=$($plan.base)" >> $env:GITHUB_OUTPUT
          "backend=$([bool]($plan.requiredChecks | Where-Object { $_ -notin @('android-build', 'android-device') }))".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          "android=$($plan.requiredChecks -contains 'android-build')".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          "device=$($plan.requiredChecks -contains 'android-device')".ToLowerInvariant() >> $env:GITHUB_OUTPUT

  backend:
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix deployment\azure ci --no-audit --no-fund
      - run: python -m pip install -r deployment\azure\probe\requirements-test.txt
      - name: Verify backend and operational fixtures
        shell: pwsh
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
        run: |
          $env:DEVPOCKET_PROBE_PYTHON = (Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          node scripts\verify.mjs --base $env:BASE_SHA --group backend --report .data\ci\backend\report.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-backend
          path: .data\ci\backend\report.json
          if-no-files-found: error

  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare project-local SDK using already accepted runner licenses
        shell: pwsh
        run: .\scripts\prepare-android.ps1 -ExistingSdk $env:ANDROID_HOME
      - name: Verify native build, JVM contracts and lint
        shell: pwsh
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
        run: |
          node scripts\verify.mjs --base $env:BASE_SHA --group android --jdk $env:JAVA_HOME --sdk .tools\android-sdk --report .data\ci\android\report.json
          exit $LASTEXITCODE
      - name: Export bounded Android failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          node scripts\android-diagnostics.mjs --directory .data\ci\android
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-android
          path: |
            .data\ci\android\report.json
            .data\ci\android\android-diagnostics.json
          if-no-files-found: error

  device:
    needs: [plan, android]
    if: >-
      needs.plan.outputs.device == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Prepare hosted KVM and stable SDK packages without accepting new licenses
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm
          test -s "$ANDROID_HOME/licenses/android-sdk-license"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --channel=0 \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" \
            "system-images;android-35;google_apis;x86_64" </dev/null
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -s "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/system.img"
      - name: Verify Linux process, ownership and build entry points
        run: node --test scripts/tests/linux-emulator.test.mjs scripts/tests/linux-process.test.mjs scripts/tests/linux-runtime.test.mjs
      - name: Check the emulator loader and resolve only its approved missing runtime dependency
        shell: pwsh
        run: |
          node scripts/linux-runtime.mjs
          exit $LASTEXITCODE
      - name: Run the required isolated emulator cases
        shell: pwsh
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
        run: |
          ./scripts/verify.ps1 -Base $env:BASE_SHA -Group device -Jdk $env:JAVA_HOME -Sdk $env:ANDROID_HOME `
            -Image system-images/android-35/google_apis/x86_64 -Report .data/ci/device/report.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-device
          path: .data/ci/device/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: emulator-tested-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            .data/ci/device/device/device-report.json
          if-no-files-found: error

  gate:
    name: Required verification
    needs: [plan, backend, android, device]
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: verification-*
          path: .data\ci\inputs
      - name: Require every selected check for this exact source
        shell: pwsh
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          if ($env:PLAN_RESULT -ne 'success') { throw 'The required check plan did not complete.' }
          $arguments = @('scripts\verify.mjs', '--base', $env:BASE_SHA, '--combine', '--report', '.data\ci\gate.json')
          if (Test-Path -LiteralPath .data\ci\inputs) {
            Get-ChildItem -LiteralPath .data\ci\inputs -Filter report.json -File -Recurse | ForEach-Object {
              $arguments += @('--input', $_.FullName)
            }
          }
          node @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Required verification is incomplete. Missing or failed device evidence is a blocker, not a skipped success.' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-summary
          path: .data\ci\gate.json
          if-no-files-found: error
