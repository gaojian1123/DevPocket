name: Extension distribution

on:
  workflow_dispatch:
  push:
    tags:
      - extension-v*

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          cache: npm
      - name: Check release tag
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "extension-v$version") {
            throw 'The extension tag must match package.json.'
          }
      - run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:setup
      - run: npm run test:extension-package
      - run: npm run package:extension
      - uses: actions/upload-artifact@v7
        with:
          name: devpocket-extension
          path: |
            dist\packages\*.zip
            dist\packages\*.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: devpocket-extension
          path: packages
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath packages -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG --verify-tag --draft `
            --title "DevPocket extension $env:RELEASE_TAG" `
            --notes 'Standalone user extension. Requires Node 26.12.1 or newer within 26.x and a compatible GitHub Copilot runtime (CLI or desktop app) with extension and bundled-SDK support. On a new Windows Dev Box, run setup with an existing azd login to enroll with your running Azure relay, or use install --user with an administrator-provisioned private host configuration. Verify the ZIP checksum and follow its README. No credentials or SDK are included.' `
            @assets
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed; existing assets were not overwritten.' }
