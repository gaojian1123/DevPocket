name: DevPocket isolated verification
run-name: DevPocket isolated verification ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact candidate commit on the authorized task branch
        required: true
        type: string
      base:
        description: Original task baseline commit
        required: true
        type: string
      branch:
        description: Authorized refs/heads task branch
        required: true
        type: string
      request_id:
        description: Unique dispatch identity; do not reuse after an uncertain dispatch
        required: true
        type: string
      trusted_sha:
        description: Independently approved control commit; reject a moved dispatch ref before any job runs
        required: true
        type: string

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

jobs:
  plan:
    if: github.workflow_sha == inputs.trusted_sha
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      required: ${{ steps.plan.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Plan using the approved control checkout, treating candidate files as data
        id: plan
        shell: pwsh
        run: |
          node control/scripts/isolated-verification.mjs --plan --repo candidate --report control/.data/ci/isolated/plan.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $plan = Get-Content -LiteralPath control/.data/ci/isolated/plan.json -Raw | ConvertFrom-Json
          "required=$($plan.matrix.Count -gt 0)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          $matrix = @(if ($plan.matrix.Count) { $plan.matrix } else { @{ group = 'none'; os = 'windows-latest' } })
          "matrix=$(ConvertTo-Json -InputObject @{ include = $matrix } -Compress)" >> $env:GITHUB_OUTPUT

  workers:
    needs: plan
    # Activation still requires approved bootstrap inputs and real Windows/Linux isolation evidence.
    if: false && github.workflow_sha == inputs.trusted_sha && needs.plan.outputs.required == 'true'
    name: Isolated ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.group == 'device' && 45 || 30 }}
    defaults:
      run:
        shell: pwsh
        working-directory: candidate
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        if: matrix.group == 'tooling' || matrix.group == 'backend'
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        if: matrix.group == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare hosted Android SDK
        if: matrix.group == 'android'
        run: |
          ../control/scripts/prepare-android.ps1 -ExistingSdk $env:ANDROID_HOME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdk = (Resolve-Path ../control/.tools/android-sdk -ErrorAction Stop).Path
          "ANDROID_HOME=$sdk" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$sdk" >> $env:GITHUB_ENV
      - uses: ./control/.github/actions/prepare-native
        if: matrix.group == 'device'
        with:
          working-directory: candidate
          cache: 'false'
          prepare-only: 'true'
      - name: Establish the candidate identity before installing or executing candidate inputs
        env:
          CHECK_GROUP: ${{ matrix.group }}
        run: |
          if ($IsWindows) {
            ../control/scripts/isolated-worker.ps1 -Control ../control -Candidate . -Group $env:CHECK_GROUP
          } else {
            $control = (Resolve-Path ../control).Path
            $candidate = (Resolve-Path .).Path
            sudo -n --preserve-env=PATH,JAVA_HOME,ANDROID_HOME,ANDROID_SDK_ROOT,GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_WORKFLOW_REF,GITHUB_SHA,GITHUB_EVENT_PATH,GITHUB_EVENT_NAME,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_WORKFLOW_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP python3 -I "$control/scripts/isolated-worker.py" $control $candidate $env:CHECK_GROUP worker
          }
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isolated-verification-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: control/.data/ci/isolated/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isolated-boundary-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: |
            control/.data/ci/isolated/isolation-proof.json
            control/.data/ci/isolated/isolation-negative-report.json
            control/.data/ci/isolated/bootstrap-failure.json
            control/.data/ci/isolated/bootstrap-capabilities.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: success() && (matrix.group == 'android' || matrix.group == 'device')
        with:
          name: isolated-build-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: |
            control/.data/ci/isolated/artifacts/app-debug.apk
            control/.data/ci/isolated/artifacts/app-debug-androidTest.apk
          if-no-files-found: error

  gate:
    name: Isolated Required verification
    needs: [plan, workers]
    if: always() && github.workflow_sha == inputs.trusted_sha
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.required == 'true'
        with:
          pattern: isolated-verification-*-attempt-${{ github.run_attempt }}
          path: control/.data/ci/isolated/inputs
      - name: Independently collect all required worker results without executing candidate code
        shell: pwsh
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          WORKER_RESULT: ${{ needs.workers.result }}
        run: |
          if ($env:PLAN_RESULT -ne 'success') { throw 'The trusted plan failed.' }
          node control/scripts/isolated-verification.mjs --collect --repo candidate --inputs control/.data/ci/isolated/inputs --outcome $env:WORKER_RESULT --report control/.data/ci/isolated/ci-report.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isolated-summary-attempt-${{ github.run_attempt }}
          path: |
            control/.data/ci/isolated/gate.json
            control/.data/ci/isolated/ci-report.json
          if-no-files-found: error
